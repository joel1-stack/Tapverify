name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version this codebase is developed against.
          # A rolling `stable` channel changed under us and broke the build.
          flutter-version: '3.38.9'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build web (release)
        run: |
          set -o pipefail
          if ! flutter build web --release --base-href=/Tapverify/ 2>&1 | tee build.log; then
            echo "::error::Flutter web build failed. Last lines of the build log:"
            tail -n 20 build.log | sed 's/%/%25/g; s/^/::error::/'
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
