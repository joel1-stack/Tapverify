<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapVerify — Link Expired</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 48px 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            text-align: center;
        }
        .icon-circle {
            width: 80px; height: 80px;
            background: #fef2f2;
            border-radius: 50%;
            margin: 0 auto 24px;
            display: flex; align-items: center; justify-content: center;
        }
        .icon-circle svg { width: 40px; height: 40px; color: #dc2626; }
        h1 { color: #0f172a; font-size: 24px; font-weight: 800; margin-bottom: 8px; }
        .subtitle { color: #64748b; font-size: 14px; margin-bottom: 32px; line-height: 1.6; }
        .contact-btn {
            display: inline-block;
            padding: 14px 32px;
            background: #2D6A4F;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
        </div>

        <h1>Link Expired</h1>
        <p class="subtitle">This payment link has expired or has already been used. Please contact your group treasurer for a new link.</p>

        <a href="tel:{{ payment_link.workspace.phone }}" class="contact-btn">Contact Treasurer</a>
    </div>
</body>
</html>
