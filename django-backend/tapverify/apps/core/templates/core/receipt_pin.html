<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapVerify — Receipt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #064E3B 0%, #059669 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 44px 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.25);
            text-align: center;
        }
        .logo {
            width: 68px; height: 68px;
            background: linear-gradient(135deg, #059669, #047857);
            border-radius: 20px;
            margin: 0 auto 22px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 30px;
            box-shadow: 0 8px 20px rgba(5,150,105,0.3);
        }
        h1 {
            color: #0F172A;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }
        p {
            color: #64748B;
            margin-bottom: 28px;
            font-size: 14px;
            line-height: 1.6;
        }
        .pin-input {
            display: flex; gap: 10px; justify-content: center; margin-bottom: 24px;
        }
        .pin-input input {
            width: 76px; height: 64px;
            border: 2px solid #E2E8F0;
            border-radius: 14px;
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            color: #0F172A;
            letter-spacing: 6px;
            transition: all 0.2s ease;
            background: #F8FAFC;
        }
        .pin-input input:focus {
            outline: none;
            border-color: #059669;
            background: white;
            box-shadow: 0 0 0 4px rgba(5,150,105,0.1);
        }
        .show-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: -12px auto 24px;
            color: #059669;
            font-size: 12px;
            font-weight: 600;
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #059669, #047857);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(5,150,105,0.3);
            letter-spacing: 0.3px;
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(5,150,105,0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .error {
            color: #DC2626;
            font-size: 13px;
            font-weight: 500;
            margin-top: 14px;
            padding: 10px;
            background: #FEF2F2;
            border-radius: 10px;
        }
        .secure-badge {
            display: flex; align-items: center; justify-content: center;
            gap: 6px; margin-top: 24px;
            color: #94A3B8; font-size: 12px;
            font-weight: 500;
        }
        .secure-badge span:first-child {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: #F0FDF4;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">&#128274;</div>
        <h1>Enter Receipt PIN</h1>
        <p>Check your SMS for the 4-digit PIN sent with this receipt link.</p>

        <form method="POST" action="/r/{{ token }}/">
            {% csrf_token %}
            <div class="pin-input">
                <input type="text" name="pin" id="pinInput" maxlength="4" placeholder="&#8226;&#8226;&#8226;&#8226;"
                       inputmode="numeric" pattern="[0-9]*" required autofocus>
            </div>
            <button type="button" class="show-toggle" onclick="togglePin()">
                <span id="toggleIcon">&#128065;</span>
                <span id="toggleLabel">Show PIN as you type</span>
            </button>
            <button type="submit">View Receipt</button>
            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}
        </form>
        <script>
            const pinInput = document.getElementById('pinInput');
            const toggleIcon = document.getElementById('toggleIcon');
            const toggleLabel = document.getElementById('toggleLabel');
            let isHidden = false;
            function togglePin() {
                isHidden = !isHidden;
                pinInput.type = isHidden ? 'password' : 'text';
                toggleIcon.textContent = isHidden ? '&#128064;' : '&#128065;';
                toggleLabel.textContent = isHidden ? 'Show PIN as you type' : 'Hide PIN';
            }
        </script>

        <div class="secure-badge">
            <span>&#128274;</span>
            <span>Secured by TapVerify</span>
        </div>
    </div>
</body>
</html>
