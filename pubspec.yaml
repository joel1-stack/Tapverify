name: tapverify
description: "TapVerify - Stop asking people if they have paid. Open this and see."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  google_fonts: ^6.1.0
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/icon_adaptive_foreground.png"
  adaptive_icon_background: "#0D9488"
  adaptive_icon_foreground: "assets/images/icon_adaptive_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
