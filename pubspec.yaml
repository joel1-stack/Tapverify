name: tapverify
description: "TapVerify — SMS payment receipts for Kenyan chamas and groups"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  geolocator: ^10.1.0
  mobile_scanner: ^3.5.5
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  qr_flutter: ^4.1.0
  file_picker: ^8.0.0
  csv: ^5.1.1
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^12.0.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/icon_adaptive_foreground.png"
  adaptive_icon_background: "#059669"
  adaptive_icon_foreground: "assets/images/icon_adaptive_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
